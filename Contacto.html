<!DOCTYPE html>
<html lang="es">
<head>
    <title>Contacto</title>
    <link rel="stylesheet" href="style/Contacto.css">
</head>
<body>
      <nav>
    <div class="logo">
        <img src="Imagenes/Trukini_Amarillo.png" alt="Logo" class="logo-img">
        <span>Tres Acordes</span>
    </div>
    <ul>
        <li>
            <a href="Productora.html"><img src="Imagenes/JAIQUE_TRES_ACORDES.png" alt="icono productora"> Productora</a>
        </li>

        <li>
            <a href="Personajes.html"><img src="Imagenes/ADRIEL_TRES_ACORDES.png" alt="icono personajes">Personajes</a>
        </li>

        <li>
            <a href="index.html"><img src="Imagenes/Trukini_Amarillo.png" alt="icono logo"> Inicio</a>
        </li>

        <li>
            <a href="Reproductor.html"><img src="Imagenes/CAPI2_TRES_ACORDES.png" alt="icono reproductor"> Reproductor</a>
        </li>

    </ul>
  </nav>
    <h1>¿Que opinas?</h1> 
    <form action="#" method="post" class="formulario-contacto">
        <label for="nombre">Nombre:</label>
        <input type="text" id="name" name="nombre" class="campo" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" class="campo" required><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" class="campo">
        <span style="opacity:0.5">(opcional)</span><br><br>

        <label for="mensaje">¿Que quieres decir?:</label><br>
        <textarea id="message" name="mensaje" rows="4" cols="30" class="campo"></textarea><br><br>

        <input type="submit" value="Enviar" class="boton">
        <input type="reset" value="Borrar todo" class="boton">
    </form>

    <div class="zona-boton">
    <button class="boton-magico resaltar">
        <h4> 🕺 BAILA LA MONA 🕺 </h4>
    </button>
  </div>

<div class="boton-alerta">
    <div class="contenido-alerta resaltar">
        <span class="cerrar-alerta">&times;</span>
        <h2>¡Baila la Mona!</h2>
        <img src="Images/GIF_ADRIEL_LA_MONA.gif" alt="Imagen Sorpresa de Tres Acordes" style="max-width: 90%; height: auto; border-radius: 5px;">
    </div>
  </div>
    
  <footer>
     <h2>Sigueme en mis diferentes paginas</h2>
      <div class="redes-sociales">
        <a href="https://www.instagram.com/produccionestrukini/?hl=es">
         <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
         Instagram
       </a>
       <a href="https://x.com/_taxideral?lang=es">
         <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
          Twitter
        </a>
        <a href="https://www.facebook.com/produccionestrukini/?locale=es_LA">
          <img src="https://cdn-icons-png.flaticon.com/512/145/145802.png" alt="Facebook">
          Facebook
       </a>
       <a href="https://www.youtube.com/@produccionestrukini">
         <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube">
         YouTube
       </a>
     </div>
  </footer>
  <script> 
    document.addEventListener('DOMContentLoaded', () => {

    const elBotonMagico = document.querySelector('.boton-magico');
    const laAlerta = document.querySelector('.boton-alerta');
    const elBotonCerrar = document.querySelector('.cerrar-alerta');

    const mostrarAlerta = (event) => {
        if (event.type === 'contextmenu') {
            event.preventDefault();
        }
        laAlerta.classList.add('mostrar-alerta');
    };

    const ocultarAlerta = () => {
        laAlerta.classList.remove('mostrar-alerta');
    };

    elBotonMagico.addEventListener('click', mostrarAlerta);
    elBotonMagico.addEventListener('contextmenu', mostrarAlerta);
    elBotonCerrar.addEventListener('click', ocultarAlerta);

    window.addEventListener('click', (event) => {

        if (event.target === laAlerta) {
            ocultarAlerta();
        }

    });

    const imagenEnAlerta = document.querySelector('.contenido-alerta img');
    
    if (imagenEnAlerta) {
        imagenEnAlerta.addEventListener('dblclick', () => {

            imagenEnAlerta.classList.toggle('efecto-js'); 
            console.log('Clase "efecto-js" alternada.');

        });
    }

    const logoSpan = document.querySelector('.logo span');
    if (logoSpan) {
        logoSpan.addEventListener('mouseenter', (event) => {
            event.target.style.color = '#131313';
        });
        logoSpan.addEventListener('mouseleave', (event) => {
            event.target.style.color = 'rgb(0, 0, 0)';
        });
    }

});
  </script>
</body>
</html>
